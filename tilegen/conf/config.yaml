# Global settings for the tile generation pipeline.

s3:
  bucket: suyana-tiles
  prefix: ""            # optional key prefix inside the bucket
  region: us-east-1

output:
  format: zarr          # zarr = cubos para series de tiempo; cog = mapas por fecha

# Las escenas (una por pais/region, ver docs/escenas_borrador.png) se
# definen en scenes.yaml. Un store Zarr por (dataset, escena):
#   s3://suyana-tiles/{dataset}/{version}/{escena}.zarr

zarr:
  time_chunk: 365       # 1 year per chunk: point series read ~1 object per year
  # Pixels per chunk side. This is a CAP, not a size: a scene smaller than it
  # ends up in a single chunk (zarrstore._chunks clamps with min()). At 128 that
  # swallowed every ERA5 scene whole (0.25 deg -> ~85x89 px), so reading one
  # sub-scene's full series pulled the entire scene for every year. 32 keeps
  # chunks around 1.5 MB and splits even the coarse grids.
  spatial_chunk: 32

grid:
  tile_size_deg: 10     # MERIT/GHSL-style fixed grid; tiles named by lower-left corner (s20w080)

runtime:
  workdir: /home/jupyter-daniela/tile_generation_module/.work
  workers: 6            # parallel granule downloads (HTTP sources only)
  keep_local: false     # keep downloaded source files after tiling

cog:
  compress: DEFLATE
  blocksize: 256
  overview_resampling: average
