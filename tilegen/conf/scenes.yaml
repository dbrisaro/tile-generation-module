# Mapa de escenas v1 (2026-07-14) — figura: docs/escenas_borrador.png
# (regenerar con: python3 docs/make_scenes_map.py)
#
# Criterios:
# - Una escena por pais; paises chicos agrupados (centroamerica, antillas, guayanas).
# - Paises gigantes partidos en sub-escenas regionales (brasil x4, mexico x2,
#   cono sur x3 con patagonia compartida entre Chile y Argentina).
# - bbox [W, S, E, N] en grados enteros: 1 grado de margen en fronteras
#   terrestres, extendido 3-5 grados mar adentro donde hay costa (la misma
#   escena sirve para variables de tierra y de mar).
# - Escenas "indice" solo para fenomenos lejos de toda costa (nino34).
#   Nino 1+2 queda dentro de la escena peru.
