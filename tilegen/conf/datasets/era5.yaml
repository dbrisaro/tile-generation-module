name: era5
version: daily-stats
description: ERA5 single-levels daily statistics, 0.25° global (Copernicus CDS, ~/.cdsapirc required)
source: era5_cds      # default; backfills can use the EDH mirror with --source era5_edh
temporal: daily
start: 1940-01-01
lag_days: 6           # ERA5T is available ~5 days behind real time
cds_dataset: derived-era5-single-levels-daily-statistics
# Este derived tiene ensemble además de reanalysis, así que el pedido lleva
# product_type. El de ERA5-Land no publica ese campo -> por eso sale del YAML
# y no está fijo en sources/era5.py (ver era5-land.yaml, que lo omite).
cds_product_type: reanalysis
# Ventana ÚNICA que se le pide al CDS, en vez de una por escena. Calculada como
# la caja que cubre las 21 escenas de scenes.yaml (el extremo oeste es nino34 en
# -170, el este brasil_nordeste en -32). El recorte por escena se hace local.
#
# Por qué: la cola del CDS cobra por PEDIDO (~20 min cada uno), no por tamaño.
# Con una ventana por escena un backfill de 380 meses son ~8.000 pedidos; con
# ésta son 380, y las otras 20 escenas leen el mismo archivo del disco.
# Cuesta ~25 MB por mes (5x menos que pedir global) -> ~10 GB por un backfill
# de 380 meses, que después se pueden podar de .work/downloads/era5/.
cds_fetch_area: [-170, -57, -32, 35]
edh_store: https://api.earthdatahub.destine.eu/era5/era5-single-levels-atmosphere-daily-utc-v0.zarr
edh_hourly_store: https://api.earthdatahub.destine.eu/era5/era5-single-levels-atmosphere-v0.zarr
variables:
  t2m_mean:
    cds_variable: 2m_temperature
    daily_statistic: daily_mean
    edh_variable: t2m
    units: K
  t2m_max:
    cds_variable: 2m_temperature
    daily_statistic: daily_maximum
    # daily EDH store has no maxima -> aggregate the hourly store locally
    edh_hourly_variable: t2m
    edh_hourly_statistic: max
    units: K
  t2m_min:
    # temperatura mínima diaria = mínimo de las 24 horas del día (heladas).
    # ERA5 no publica una mínima diaria: `mn2t` existe pero su ventana es
    # "desde el último post-proceso", que no cae en el día calendario, así que
    # quedaría corrida respecto de t2m_max. Se agrega desde la serie horaria,
    # igual que la máxima.
    cds_variable: 2m_temperature
    daily_statistic: daily_minimum
    edh_hourly_variable: t2m
    edh_hourly_statistic: min
    units: K
  precip_sum:
    cds_variable: total_precipitation
    daily_statistic: daily_sum
    # daily EDH store has no accumulated vars -> aggregate the hourly store locally
    edh_hourly_variable: tp
    edh_hourly_statistic: sum
    units: m
  ssrd_sum:
    # surface solar radiation downwards, daily total in J m-2 (hourly
    # accumulations summed). Monthly irradiation is derived downstream:
    #   kWh m-2 = sum(clip(ssrd_sum, 0, None)) / 3.6e6   over the month's days
    # Summing the real days is exact, so no days-in-month factor is needed.
    cds_variable: surface_solar_radiation_downwards
    daily_statistic: daily_sum
    # daily EDH store has no accumulated vars -> aggregate the hourly store locally
    edh_hourly_variable: ssrd
    edh_hourly_statistic: sum
    units: J m-2
  fg10_max:
    # ráfaga máxima diaria de viento a 10 m, en m/s.
    #
    # `fg10` en ERA5 es "maximum 10m wind gust SINCE PREVIOUS POST-PROCESSING",
    # o sea que cada valor horario ya es el máximo de esa hora. La máxima del día
    # es entonces el máximo de las 24 horas -> daily_maximum. Ojo de no
    # confundirla con `i10fg` (instantaneous_10m_wind_gust), que es la ráfaga
    # instantánea en la hora exacta y da valores más bajos.
    #
    # NO tiene mapeo EDH a propósito: el mirror horario de EDH no publica
    # ninguna variable de ráfaga (tiene u10/v10 y nada más), verificado contra
    # el store el 2026-08-26. Así que esta variable va SOLO por CDS, que es la
    # ruta con cola -> el histórico es caro, ver .work/backfill_fg10.sh.
    cds_variable: 10m_wind_gust_since_previous_post_processing
    daily_statistic: daily_maximum
    units: m s-1
  swvl1:
    # volumetric soil water layer 1 (soil moisture, 0-7cm). Only in the hourly
    # EDH store -> daily MEAN aggregated locally. No cds_variable on purpose:
    # the daily cron (era5_cds) lists the atmospheric vars explicitly and skips
    # this one; swvl1 rides the EDH mirror's monthly updates.
    edh_hourly_variable: swvl1
    edh_hourly_statistic: mean
    units: m3 m-3
  sd_mean:
    # NIEVE: "snow depth" de ERA5 (`sd`) NO es la altura de la nieve, es el
    # EQUIVALENTE EN AGUA del manto: cuánta agua queda si se derrite todo, en
    # metros. Por eso viaja junto a rsn_mean (densidad); la altura física sale
    # de las dos:
    #     altura_nieve (m) = sd_mean * 1000 / rsn_mean
    # Guardamos las dos crudas en vez de la altura ya calculada porque el
    # equivalente en agua es lo que importa para deshielo y caudal, y la altura
    # se deriva sin volver a bajar nada.
    #
    # Es una variable de ESTADO (el manto que hay en ese instante), no una
    # acumulación, así que el diario es el promedio de las 24 horas -> igual que
    # t2m_mean, y a diferencia de precip_sum.
    cds_variable: snow_depth
    daily_statistic: daily_mean
    # el store diario de EDH ya la trae promediada -> backfill barato (1 valor
    # por día en vez de leer 24 horas), como t2m_mean.
    edh_variable: sd
    units: m of water equivalent
  rsn_mean:
    # densidad del manto de nieve, kg/m3. Sola no se usa: está para convertir
    # sd_mean a altura real de nieve (ver el comentario de sd_mean).
    #
    # A diferencia de sd, el store DIARIO de EDH no la publica (verificado
    # contra el store el 2026-09-04: sólo sd), así que el histórico sale del
    # store horario promediando las 24 horas localmente.
    cds_variable: snow_density
    daily_statistic: daily_mean
    edh_hourly_variable: rsn
    edh_hourly_statistic: mean
    units: kg m-3
